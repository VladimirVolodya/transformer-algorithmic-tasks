defaults:
  - model: transformer
  - _self_

# IMPORTANT: model.pe_variant must match the checkpoint being loaded.
# Defaults evaluate the NoPE run; override both for other variants, e.g.:
#   python inference.py model.pe_variant=absolute \
#     inferencer.from_pretrained=saved/addition_absolute/model_best.pth
model:
  pe_variant: nope

inferencer:
  device: auto
  from_pretrained: "saved/addition_nope/model_best.pth"
  eval_length: 6        # operand digit length to evaluate (OOD if > 5)
  n_samples: 256
  num_show: 8           # decoded examples to print
  batch_size: 256
  seed: 12345           # seed for the deterministic eval set
