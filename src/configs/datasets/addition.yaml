# train: fresh on-the-fly samples, operand lengths uniform in [1, 5].
# val:   deterministic in-distribution set (mixed lengths 1-5) for the
#        teacher-forced ExactMatch monitor -- identical across PE variants.
train:
  _target_: src.datasets.addition_dataset.AdditionDataset
  split: train
  min_len: 1
  max_len: 5
  dataset_length: 100000        # nominal length; content generated per __getitem__
  seed: ${trainer.seed}
  name: train
  instance_transforms: ${transforms.instance_transforms.train}
val:
  _target_: src.datasets.addition_dataset.AdditionDataset
  split: eval
  min_len: 1
  max_len: 5
  fixed_length: null            # null -> mixed lengths 1-5 (in-distribution)
  dataset_length: 512
  seed: 12345
  name: val
  instance_transforms: ${transforms.instance_transforms.inference}
