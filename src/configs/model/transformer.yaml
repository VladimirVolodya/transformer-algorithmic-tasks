# Default architecture aligns with Phase-2 Arch B (baseline), NoPE.
# Grid search overrides d_model / n_heads / d_ff via src.model.architectures.
_target_: src.model.transformer.DecoderTransformer
vocab_size: 19        # TaskTokenizer size (digits, ops, brackets, comma, specials)
d_model: 128
n_layers: 4
n_heads: 4
head_dim: 32          # d_model // n_heads
d_ff: 512
max_len: 128          # covers OOD sequences with slack
pe_variant: nope      # causal mask only (no absolute/RoPE length binding)
dropout: 0.0
pad_id: 13
