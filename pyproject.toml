[project]
name = "transformer-algorithmic-tasks"
version = "0.1.0"
description = "From-scratch decoder-only transformer for algorithmic tasks (ADDITION / SORT / DYCK / INDEX) with a unified train+eval benchmark and swappable positional encodings."
requires-python = "==3.11.*"
dependencies = [
    "torch==2.2.0",
    "numpy==1.26.4",
    "hydra-core",
    "omegaconf",
    "wandb",
    "tqdm",
    "matplotlib",
    "pandas",
    "ipykernel",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "pre-commit",
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
